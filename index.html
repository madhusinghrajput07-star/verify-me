<!DOCTYPE html>
<html>
<head>
    <title>VerifyMe Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>VerifyMe</h1>
        <p>Open your account — it takes about 3 minutes</p>

        <div class="steps">
            <span class="active">1. IDENTITY</span>
            <span class="active">2. ADDRESS & INCOME</span>
            <span class="active">3. DOCUMENTS</span>
        </div>

        <form>
            <div class="name">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div class="email">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="mobile">
                <label for="mobile">Mobile Number</label>
                <input type="text" id="country-code" placeholder="+91" readonly id="mobile" placeholder="10-digit mobile">
            </div>
            <div class="pan">
                <label for="pan">PAN</label>
                <input type="text" id="pan" placeholder="ABCDE1234F">
            </div>

            <div class="buttons">
                <button type="button" class="back">Back</button>
                <button type="submit" class="continue">Continue</button>
            </div>

        </form>

        <p class="footer">
            🔒 Bank-grade encryption · your data is never sold
        </p>

    </div>

</body>
</html>
